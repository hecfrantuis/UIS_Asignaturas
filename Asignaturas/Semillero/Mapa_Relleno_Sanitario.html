    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: #e8e8e0;
  }

  .header-sub {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    color: #6b7280;
    margin-top: 1px;
  }

  .legend {
    display: flex;
    gap: 16px;
    flex-wrap: wrap;
    align-items: center;
  }

  .legend-item {

    align-items: center;
    gap: 6px;
    font-size: 11px;
    color: #9ca3af;
    cursor: pointer;
    padding: 4px 8px;
    border-radius: 4px;

  .stats {

  .stat {

  .stat-num {

    font-size: 18px;
    font-weight: 600;
    line-height: 1;

  .stat-label {

    letter-spacing: 0.1em;
    color: #6b7280;
    margin-top: 2px;

// Map init
const map = L.map('map', {
  center: [5.0, -74.0],
  zoom: 6,
  zoomControl: false,
  attributionControl: true
});

L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
  attribution: '© OpenStreetMap © CARTO',
  subdomains: 'abcd',
  maxZoom: 19
}).addTo(map);

L.control.zoom({ position: 'bottomright' }).addTo(map);

// State
let activeTypes = new Set(['Relleno Sanitario','Botadero A Cielo Abierto','Celda De Contingencia','Celda Transitoria']);
let activeDepto = 'TODOS';
let searchTerm = '';
let markers = [];

function makeIcon(tipo) {
  const c = COLORS[tipo] || { fill: '#888', border: '#555' };
  return L.circleMarker;
}

function buildPopup(d) {
  const c = COLORS[d.TIPO_DE_SI] || { fill: '#888' };
  const typeColors = {
    'Relleno Sanitario':       { bg: '#14532d', text: '#4ade80' },
    'Botadero A Cielo Abierto':{ bg: '#450a0a', text: '#f87171' },
    'Celda De Contingencia':   { bg: '#451a03', text: '#fbbf24' },
    'Celda Transitoria':       { bg: '#2e1065', text: '#a78bfa' },
  };
  const tc = typeColors[d.TIPO_DE_SI] || { bg: '#1c1f2a', text: '#9ca3af' };
  return `<div class="popup-inner">
    <div class="popup-type" style="background:${tc.bg};color:${tc.text}">${d.TIPO_DE_SI}</div>
    <div class="popup-name">${d.NOMBRE_DEL}</div>
    <div class="popup-meta">
      <strong>Departamento</strong> ${d.DEPARTAMEN}<br>
      <strong>Municipio</strong> ${d.MUNICIPIO_}<br>
      <strong>Coords</strong> ${d.latitude.toFixed(5)}, ${d.longitude.toFixed(5)}
    </div>
  </div>`;
}

function renderMarkers() {
  markers.forEach(m => map.removeLayer(m));
  markers = [];
  const q = searchTerm.toLowerCase();
  let count = 0;
  DATA.forEach(d => {
    const typeOk = activeTypes.has(d.TIPO_DE_SI);
    const deptoOk = activeDepto === 'TODOS' || d.DEPARTAMEN.toUpperCase().includes(activeDepto);
    const searchOk = !q || d.NOMBRE_DEL.toLowerCase().includes(q) || d.MUNICIPIO_.toLowerCase().includes(q);
    if (!typeOk || !deptoOk || !searchOk) return;
    const c = COLORS[d.TIPO_DE_SI] || { fill: '#888', border: '#555', r: 6 };
    const m = L.circleMarker([d.latitude, d.longitude], {
      radius: c.r,
      fillColor: c.fill,
      color: c.border,
      weight: 1.5,
      fillOpacity: 0.85,
      opacity: 1,
    })
    .bindPopup(buildPopup(d), { maxWidth: 300, className: '' })
    .bindTooltip(d.NOMBRE_DEL, { direction: 'top', offset: [0, -6] });
    m.addTo(map);
    markers.push(m);
    count++;
  });
  document.getElementById('visible-count').textContent = count;
}

function toggleType(el) {
  const t = el.dataset.type;
  if (activeTypes.has(t)) { activeTypes.delete(t); el.classList.add('inactive'); }
  else { activeTypes.add(t); el.classList.remove('inactive'); }
  renderMarkers();
}

function filterDepto(depto, btn) {
  activeDepto = depto;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderMarkers();
}

function doSearch(val) {
  searchTerm = val;
  renderMarkers();
}

renderMarkers();
</script>
